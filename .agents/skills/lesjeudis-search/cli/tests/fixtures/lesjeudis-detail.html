<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Développeur informatique éditique - F/H","description":"Description de l'entreprise\n\nLe groupe Coexya, leader du numérique et multi-spécialiste (conseil, intégration & développement), compte plus de 950 collaborateurs présents sur les sites de Lyon, Paris, Rennes, Brest et Lille, et accompagne les entreprises dans leur transformation digitale.\n\nCoexya œuvre sur de nombreux projets qui contribuent au progrès sociétal (santé, environnement, responsabilité numérique...).\n\nLe respect de nos valeurs : engagement, respect et partage, est un élément essentiel de notre culture d'entreprise et cela commence dès l'étape de recrutement.\n\nAu quotidien, le groupe œuvre afin de garantir la diversité et le bien-être de ses collaborateurs, limiter son impact environnemental et accompagner les démarches éthiques.\n\nEn 2024, Coexya a rejoint le groupe Talan, acteur international de conseil et d'expertises technologiques qui accélère la transformation de ses clients par les leviers de l'innovation, la technologie et la data.\n\nEngagés en faveur de la diversité et de l'inclusion, tous nos postes sont ouverts aux personnes en situation de handicap. Des aménagements peuvent être proposés à chaque étape du processus de recrutement ainsi que tout au long du parcours professionnel des collaborateurs au sein du groupe.\n\nDescription du poste\n\nCE QUE L'ON VOUS PROPOSE\n\nEn tant que développeur informatique éditique, vous intégrerez une équipe projet de 5-8 personnes. En nous rejoignant, vous accompagnerez des entreprises dans la conception de leurs solutions d'échanges avec leurs clients (SMS, email, courrier papier, page ou portail Web). Il s'agit plus largement d'intervenir dans la gestion de l'activité documentaire sortante de nos clients grands comptes (marché de l'éditique / CCM - Customer Communication Management).\n\nVos missions seront les suivantes :\n\n- Intervenir sur les phases de cadrage du besoin client, de rédaction des spécifications techniques et fonctionnelles ainsi que sur les phases d'homologation,\n\n- Concevoir et développer des modèles de documents au travers des progiciels CCM (Quadient, OpenText),\n\n- Participer aux phases de recettes et maintenance des applications,\n\n- Être force de proposition dans l'industrialisation et l'automatisation des processus internes à l'agence, ainsi que de nos clients (à travers notamment Python, Java).\n\nEn fonction de vos ambitions, le poste est évolutif vers différents métiers à responsabilité (chef de projet, expert technique, etc.).\n\nQualifications\n\nCE QUE L'ON ATTEND DE VOUS\n\n- Formation en informatique et expérience/projet en développement informatique\n\n- Organisation, rigueur et curiosité\n\n- Esprit de logique et capacité à résoudre des problèmes de manière méthodique\n\n- Sens du service, très bonne communication afin de dialoguer avec des interlocuteurs techniques comme métiers, de comprendre leurs besoins et proposer des solutions adaptées\n\n- Esprit d'équipe, avec un brin d'humour !\n\nInformations supplémentaires\n\nLES BONUS COEXYA RENNES\n\n- Un mode de travail hybride : jusqu'à 10 jours de télétravail flexible par mois\n\n- Un management de proximité et des formations régulières pour accompagner votre évolution (programme Escales by Coexya, serious games, ateliers tech, agilité, soft skills...)\n\n- Une agence avec la majorité de nos projets au forfait au sein de nos locaux (peu de régie pour une ESN)\n\n- Un parcours d'intégration personnalisé, sur plusieurs mois, incluant un welcome pack dès votre arrivée\n\n- Un cadre de travail agréable et ressourçant : salle de loisirs (ping-pong, fléchettes...), salles de sieste et afterworks réguliers. Parc des Gayeulles et salles de sport à 2 pas, pratique pour se dépenser sur la pause déjeuner et profiter des douches au sein de nos locaux\n\n- Un programme de mobilité douce : vélos et voitures électriques, remboursement de 75% de l'abonnement transports en commun, ou possibilité de bénéficier d'un forfait mobilité d'un montant de 30€ par mois\n\n- 40 % des collaborateurs sont actionnaires, renforçant l'engagement collectif et la dynamique d'entreprise\n\n- Enfin, des événements techniques, sportifs et conviviaux : hackathons, blindtests, poker, tournoi de badminton, palet breton...\n\nPARCOURS DE RECRUTEMENT\n\nIl est divisé en 3 étapes :\n\n- Un échange téléphonique ou visio d'environ 15 minutes avec une personne de l'équipe recrutement (Héloïse ou Floriane).\n\n- Un entretien avec vos futurs N+1 pour échanger sur vos visions respectives du poste\n\n- Un entretien avec le directeur de l'agence Farid Bezzaï, pour parler de vos envies professionnelles et des perspectives proposées au sein de Coexya Rennes\n\nSi nous poursuivons ensemble, vous rencontrerez vos futurs collègues au travers d'une visite de nos locaux rennais.\n\nVous vous reconnaissez ? Postulez et rencontrons-nous !\n\nVideos To Watch\nhttps://www.youtube.com/watch?v=dNqAk9HGgYU&list=PLgAgqS2kjTzP0mtdT-k5Vff9rwTY4sJ7_&index=6","datePosted":"2026-10-10T12:33:27.945000+00:00","hiringOrganization":{"@type":"Organization","name":"Talan","sameAs":"https://www.talan.com","logo":"https://lesjeudis.s3.eu-west-par.io.cloud.ovh.net/organizations/logos/296b0b4c-1466-4dc0-b0cf-bd47a46f0c47/dcffeaa389754e3cbd6d1bea65cfac13_talan-logo.png"},"url":"https://lesjeudis.com/offers/developpeur-informatique-editique-f-h-f0d394df","identifier":{"@type":"PropertyValue","name":"LesJeudis","value":"f0d394df-f868-4124-b5de-b7c8fcfdaf70"},"validThrough":"2026-11-09T13:21:15.710658+00:00","directApply":false,"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Rennes","addressCountry":"FR","postalCode":"35000"}}}</script>
